<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#bae6fd"/></linearGradient>
    <style>
      .plane{animation:fly 8s linear -3.5s infinite;offset-path:path('M-60 270C250 250 450 60 1260 40');offset-rotate:auto}
      @keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
      .cloud{animation:drift 30s linear infinite}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-300px)}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <g class="cloud" fill="#fff" opacity=".8">
    <g transform="translate(560 70)"><circle r="22"/><circle cx="26" cy="-8" r="28"/><circle cx="56" r="20"/><rect x="0" y="0" width="56" height="20"/></g>
    <g transform="translate(1100 220)"><circle r="18"/><circle cx="22" cy="-6" r="22"/><circle cx="46" r="16"/><rect y="0" width="46" height="16"/></g>
    <g transform="translate(1350 90)"><circle r="20"/><circle cx="24" cy="-8" r="26"/><circle cx="52" r="18"/><rect y="0" width="52" height="18"/></g>
  </g>
  <path d="M-60 270C250 250 450 60 1260 40" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 10" opacity=".7"/>
  <!-- boarding pass -->
  <g transform="translate(60 52)">
    <rect x="4" y="6" width="640" height="216" rx="14" fill="#0c4a6e" opacity=".25"/>
    <rect width="640" height="216" rx="14" fill="#fff"/>
    <rect width="640" height="46" rx="14" fill="#0369a1"/><rect y="30" width="640" height="16" fill="#0369a1"/>
    <text x="24" y="30" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e0f2fe" letter-spacing="4">BOARDING PASS · JAVA SWING</text>
    <line x1="470" y1="56" x2="470" y2="206" stroke="#94a3b8" stroke-dasharray="6 6"/>
    <text x="24" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#0c4a6e">Air Ticket</text>
    <text x="24" y="166" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="300" fill="#0369a1">Management System</text>
    <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#64748b"><text x="24" y="196">ADMIN · USER · AIRLINES · FLIGHTS · SELL TICKET</text>
      <text x="490" y="84">FROM</text><text x="490" y="140">TO</text></g>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0c4a6e"><text x="490" y="116">DAC</text><text x="490" y="172">CXB</text></g>
    <g fill="#0f172a"><rect x="580" y="80" width="3" height="100"/><rect x="586" y="80" width="6" height="100"/><rect x="595" y="80" width="2" height="100"/><rect x="600" y="80" width="5" height="100"/><rect x="608" y="80" width="2" height="100"/><rect x="613" y="80" width="4" height="100"/></g>
  </g>
  <g class="plane"><g transform="scale(1.3)"><path d="M-20 0h30l12-4c4 0 4 8 0 8l-12-4zM-2 0l-10-16h6l14 16zM-2 0l-10 16h6l14-16zM-20 0l-6-8h4l6 8z" fill="#fff"/></g></g>
</svg>
